name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: ESLint + Prettier
        run: npx eslint . && npx prettier --check .

      - name: No-XPath check
        run: npm run check:selectors

      - name: Test matrix in sync with specs
        run: node scripts/matrix.js --check

      - name: Unit tests (no device needed)
        run: npm run test:unit
